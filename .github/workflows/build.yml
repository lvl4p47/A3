name: C/C++ CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install SDL2
      run: sudo apt-get update
            sudo apt-get update sudo apt-get install libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
    - name: build project
      run: ./build.sh
  
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install SDL2
      run: sudo apt-get update
        sudo apt-get update sudo apt-get install libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev
    - name: install cunit
      run: sudo apt-get install libcunit1-dev
    - name: run unit tests
      run: ./test.sh
